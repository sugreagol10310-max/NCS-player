<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Chart Master (Tier & Direct Rank)</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; font-size: 22px; }
    .mode-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .mode-btn { padding: 8px 16px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 20px; cursor: pointer; }
    .mode-btn.active { background: #ff0055; border-color: #ff0055; }
    .main-container { display: flex; gap: 20px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
    .left-panel { flex: 1 1 500px; display: flex; flex-direction: column; gap: 15px; }
    .player-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
    .track-info, .panel { background: #1e1e1e; padding: 15px; border-radius: 10px; }
    .track-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 8px; }
    .track-meta { font-size: 14px; color: #aaa; display: flex; gap: 15px; margin-bottom: 12px; }
    
    /* ティア＆順位操作エリア */
    .tier-control { display: flex; flex-direction: column; gap: 10px; background: #2a2a2a; padding: 12px; border-radius: 8px; }
    .tier-display-box { display: flex; align-items: center; justify-content: space-between; }
    .tier-badge { font-size: 18px; font-weight: bold; color: #ffcc00; }
    .rank-move-box { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
    .rank-input { width: 70px; padding: 6px; background: #121212; border: 1px solid #555; border-radius: 4px; color: #fff; text-align: center; }
    
    .btn { padding: 6px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
    .btn:hover { background: #444; }
    .btn-action { background: #ff0055; border: none; font-weight: bold; }
    .nav-controls { display: flex; gap: 10px; margin-top: 10px; }
    .nav-btn { flex: 1; padding: 10px; background: #ff0055; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-row { display: flex; gap: 10px; }
    input, select { padding: 8px; background: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: #fff; flex: 1; }
    .btn-add { background: #00aa55; color: #fff; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .backup-controls { display: flex; gap: 10px; }
    .btn-backup { flex: 1; padding: 8px; background: #3a3a3a; color: #ccc; border: 1px solid #555; border-radius: 5px; cursor: pointer; font-size: 13px; }
    .btn-backup:hover { background: #555; color: #fff; }
    
    .right-panel { flex: 1 1 350px; background: #1e1e1e; border-radius: 10px; padding: 15px; max-height: 800px; display: flex; flex-direction: column; }
    .ranking-title { font-size: 16px; margin-bottom: 10px; color: #fff; border-bottom: 1px solid #333; padding-bottom: 5px; }
    .rank-list { list-style: none; overflow-y: auto; flex: 1; }
    
    /* ティア区切りヘッダー */
    .tier-header { background: #2a1122; color: #ff0055; font-weight: bold; padding: 6px 10px; font-size: 12px; border-left: 4px solid #ff0055; margin-top: 8px; margin-bottom: 4px; }
    .rank-item { display: flex; align-items: center; padding: 8px 10px; border-bottom: 1px solid #2a2a2a; font-size: 14px; border-radius: 5px; cursor: pointer; }
    .rank-item.active { background: #331122; border: 1px solid #ff0055; }
    .rank-num { width: 40px; font-weight: bold; color: #888; }
    .rank-item.active .rank-num { color: #ff0055; }
    .rank-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
    .rank-tier-tag { font-size: 11px; background: #333; color: #ffcc00; padding: 2px 6px; border-radius: 3px; margin-right: 8px; font-weight: bold; }
    .rank-del-btn { background: transparent; border: none; color: #666; cursor: pointer; }
  </style>
</head>
<body>

  <h1>🎵 My Music Chart Master (Tier System)</h1>

  <div class="mode-selector">
    <button class="mode-btn active" onclick="setMode('all', event)">全曲順</button>
    <button class="mode-btn" onclick="setMode('top20', event)">TOP 20</button>
    <button class="mode-btn" onclick="setMode('bottom', event)">育成</button>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="player-wrapper"><div id="player"></div></div>

      <div class="track-info">
        <div class="track-title" id="display-title">読み込み中...</div>
        <div class="track-meta">
          <span>👁 視聴: <span id="display-plays">0</span>回</span>
          <span>📅 年: <span id="display-year">-</span></span>
        </div>
        
        <div class="tier-control">
          <div class="tier-display-box">
            <span>🏆 ランク: <span class="tier-badge" id="display-tier">-</span></span>
            <div>
              <label style="font-size:12px; color:#aaa;">ティア変更: </label>
              <select id="select-tier" onchange="changeCurrentSongTier(this.value)" style="padding: 4px; font-size: 12px; flex:none; width: auto;">
                </select>
            </div>
          </div>
          <div class="rank-move-box">
            <span style="font-size:13px; color:#aaa;">順位指定:</span>
            <input type="number" id="input-direct-rank" class="rank-input" min="1" placeholder="位">
            <button class="btn btn-action" onclick="moveCurrentSongToRank()">移動</button>
            <button class="btn" onclick="moveCurrentSongStep(-1)">▲ 上へ</button>
            <button class="btn" onclick="moveCurrentSongStep(1)">▼ 下へ</button>
          </div>
        </div>

        <div class="nav-controls">
          <button class="nav-btn" onclick="prevSong()">前の曲</button>
          <button class="nav-btn" onclick="nextSong()">次の曲</button>
        </div>
      </div>

      <div class="panel">
        <div style="font-weight:bold; margin-bottom:10px;">➕ 楽曲を追加</div>
        <div class="form-group">
          <input type="text" id="input-title" placeholder="タイトル">
          <input type="text" id="input-ytid" placeholder="YouTube URL または ID">
          <div class="form-row">
            <input type="number" id="input-year" placeholder="年" value="2024">
            <select id="input-tier">
              </select>
          </div>
          <button class="btn-add" onclick="addNewSong()">追加</button>
        </div>
      </div>

      <div class="panel">
        <div style="font-weight:bold; margin-bottom:10px;">💾 データ管理 (Firebase同期)</div>
        <div class="backup-controls">
          <button class="btn-backup" onclick="exportData()">バックアップ保存 (.json)</button>
          <button class="btn-backup" onclick="document.getElementById('import-file').click()">復元 (JSONを読み込み)</button>
          <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="ranking-title">🏆 ランキング (リアルタイム同期中)</div>
      <ul class="rank-list" id="rank-list"></ul>
    </div>
  </div>

  <script>
    // --------------------------------------------------
    // 🔥 ティア設定マスター定義
    // --------------------------------------------------
    const TIER_DEFINITIONS = [
      { code: "SSSS", name: "So Masterpiece", minScore: 100 },
      { code: "SS",   name: "Masterpiece",    minScore: 95 },
      { code: "S+",   name: "Brilliant",      minScore: 90 },
      { code: "S",    name: "Wonderful",      minScore: 80 },
      { code: "A+",   name: "Great",          minScore: 70 },
      { code: "A",    name: "Cool",           minScore: 60 },
      { code: "B+",   name: "Good",           minScore: 50 },
      { code: "B",    name: "Mid",            minScore: 40 },
      { code: "C+",   name: "Not Bad",        minScore: 30 },
      { code: "C",    name: "Meh",            minScore: 20 },
      { code: "D",    name: "Uncool",         minScore: 10 },
      { code: "E",    name: "Bad",            minScore: 5 },
      { code: "F",    name: "Too Bad",        minScore: 0 }
    ];

    // スコア(旧データ)から初期ティアを自動変換する関数
    function scoreToTierCode(score) {
      for (let t of TIER_DEFINITIONS) {
        if (score >= t.minScore) return t.code;
      }
      return "F";
    }

    // --------------------------------------------------
    // 🔥 Firebase設定（ご自身のキーを入れてください）
    // --------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCNrw2H5gjO7Ai_eOJxuwe6UzeG06l_MFQ",
      authDomain: "ncs-music-e2d05.firebaseapp.com",
      databaseURL: "https://ncs-music-e2d05-default-rtdb.firebaseio.com",
      projectId: "ncs-music-e2d05",
      storageBucket: "ncs-music-e2d05.firebasestorage.app",
      messagingSenderId: "211698967527",
      appId: "1:211698967527:web:3d856f269a6d445fda1342"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const songsRef = db.ref('music_chart/songs');

    // --------------------------------------------------
    // アプリ変数
    // --------------------------------------------------
    let songs = [];
    let currentPlaylist = [];
    let currentIndex = 0;
    let player;
    let currentMode = 'all';

    let listenedSeconds = 0;
    let isCountedCurrentSong = false;
    let listenTimer = null;

    // セレクトボックス初期化
    function initTierSelects() {
      const selectTier = document.getElementById('select-tier');
      const inputTier = document.getElementById('input-tier');
      selectTier.innerHTML = '';
      inputTier.innerHTML = '';

      TIER_DEFINITIONS.forEach(t => {
        const opt = `<option value="${t.code}">${t.code} (${t.name})</option>`;
        selectTier.innerHTML += opt;
        inputTier.innerHTML += opt;
      });
      inputTier.value = "A+"; // デフォルト追加時のティア
    }
    initTierSelects();

    // 🔥 Firebaseからリアルタイム取得
    songsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const currentSongId = currentPlaylist[currentIndex] ? currentPlaylist[currentIndex].id : null;

      if (data) {
        // 旧データ（scoreのみ）があれば互換性のためtierとorderを付与
        let rawSongs = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        
        // 順位（order）が無い場合は、スコア順に順位を1, 2, 3...と付与
        rawSongs.sort((a, b) => (b.score || 0) - (a.score || 0));
        
        songs = rawSongs.map((s, idx) => ({
          id: s.id,
          youtubeId: s.youtubeId,
          title: s.title,
          year: s.year || 2024,
          playCount: s.playCount || 0,
          tier: s.tier || scoreToTierCode(s.score || 80),
          order: s.order !== undefined ? s.order : idx
        }));
      } else {
        songs = [];
      }

      sortSongs();
      updatePlaylistByMode();

      if (currentSongId) {
        const newIndex = currentPlaylist.findIndex(s => s.id === currentSongId);
        if (newIndex !== -1) currentIndex = newIndex;
      }

      renderRankingUI();
      updateTrackInfoDisplay();

      if (currentPlaylist.length > 0 && (!player || !player.getVideoData)) {
        loadCurrentSong();
      }
    });

    function saveAllToFirebase() {
      const dataObj = {};
      songs.forEach((s, index) => {
        s.order = index; // 現在の配列順をそのままorderとして保存
        dataObj[s.id] = s;
      });
      songsRef.set(dataObj);
    }

    function sortSongs() {
      // order（順位）プロパティで昇降ソート
      songs.sort((a, b) => a.order - b.order);
      // 再番号付け
      songs.forEach((s, i) => s.order = i);
    }

    // --------------------------------------------------
    // 順位ダイレクト移動 ＆ ティア変更処理
    // --------------------------------------------------
    function changeCurrentSongTier(newTier) {
      if (currentPlaylist.length === 0) return;
      const song = currentPlaylist[currentIndex];
      song.tier = newTier;
      db.ref(`music_chart/songs/${song.id}/tier`).set(newTier);
    }

    function moveCurrentSongToRank() {
      if (currentPlaylist.length === 0) return;
      const targetInput = document.getElementById('input-direct-rank');
      let targetRank = parseInt(targetInput.value);

      if (isNaN(targetRank) || targetRank < 1 || targetRank > songs.length) {
        return alert(`1〜${songs.length}位の間で指定してください。`);
      }

      const song = currentPlaylist[currentIndex];
      const oldIndex = songs.findIndex(s => s.id === song.id);
      const newIndex = targetRank - 1;

      if (oldIndex !== -1) {
        songs.splice(oldIndex, 1);
        songs.splice(newIndex, 0, song);
        saveAllToFirebase();
        targetInput.value = '';
      }
    }

    function moveCurrentSongStep(step) {
      if (currentPlaylist.length === 0) return;
      const song = currentPlaylist[currentIndex];
      const oldIndex = songs.findIndex(s => s.id === song.id);
      const newIndex = oldIndex + step;

      if (newIndex >= 0 && newIndex < songs.length) {
        songs.splice(oldIndex, 1);
        songs.splice(newIndex, 0, song);
        saveAllToFirebase();
      }
    }

    // --------------------------------------------------
    // 💾 JSON バックアップ & 復元
    // --------------------------------------------------
    function exportData() {
      if (songs.length === 0) return alert('保存するデータがありません。');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songs, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `music_chart_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedSongs = JSON.parse(e.target.result);
          if (Array.isArray(importedSongs)) {
            if (confirm(`現在のデータを上書きし、${importedSongs.length}曲のデータをFirebaseへ一括登録しますか？`)) {
              songs = importedSongs.map((s, idx) => ({
                ...s,
                tier: s.tier || scoreToTierCode(s.score || 80),
                order: idx
              }));
              saveAllToFirebase();
              alert('Firebaseへのデータ復元が完了しました！');
            }
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    }

    // --------------------------------------------------
    // 楽曲操作＆再生機能
    // --------------------------------------------------
    function addNewSong() {
      const titleInput = document.getElementById('input-title');
      let ytidInput = document.getElementById('input-ytid').value.trim();
      const yearInput = document.getElementById('input-year');
      const tierInput = document.getElementById('input-tier');

      if (!titleInput.value.trim() || !ytidInput) return alert('入力してください');

      if (ytidInput.includes('v=')) ytidInput = ytidInput.split('v=')[1].split('&')[0];
      else if (ytidInput.includes('youtu.be/')) ytidInput = ytidInput.split('youtu.be/')[1].split('?')[0];

      const newId = Date.now().toString();
      const newSong = {
        id: newId,
        youtubeId: ytidInput,
        title: titleInput.value.trim(),
        year: parseInt(yearInput.value) || 2024,
        tier: tierInput.value,
        playCount: 0,
        order: songs.length // 最下位に追加
      };

      db.ref(`music_chart/songs/${newId}`).set(newSong);

      titleInput.value = '';
      document.getElementById('input-ytid').value = '';
    }

    function deleteSong(id, e) {
      e.stopPropagation();
      if (confirm('削除しますか？')) {
        db.ref(`music_chart/songs/${id}`).remove();
      }
    }

    function updatePlaylistByMode() {
      if (currentMode === 'top20') currentPlaylist = songs.slice(0, 20);
      else if (currentMode === 'bottom') currentPlaylist = songs.slice(Math.floor(songs.length / 2)).sort(() => Math.random() - 0.5);
      else currentPlaylist = [...songs];
    }

    function setMode(mode, e) {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      currentMode = mode;
      updatePlaylistByMode();
      currentIndex = 0;
      loadCurrentSong();
    }

    function updateTrackInfoDisplay() {
      if (currentPlaylist.length === 0) {
        document.getElementById('display-title').innerText = "データがありません";
        return;
      }
      const song = currentPlaylist[currentIndex];
      if (song) {
        document.getElementById('display-title').innerText = song.title;
        document.getElementById('display-plays').innerText = song.playCount;
        document.getElementById('display-year').innerText = song.year;
        
        const tierObj = TIER_DEFINITIONS.find(t => t.code === song.tier) || { name: song.tier };
        document.getElementById('display-tier').innerText = `${song.tier} (${tierObj.name})`;
        document.getElementById('select-tier').value = song.tier;
        document.getElementById('input-direct-rank').placeholder = `${song.order + 1}位`;
      }
    }

    function loadCurrentSong() {
      if (currentPlaylist.length === 0) return;
      const song = currentPlaylist[currentIndex];

      updateTrackInfoDisplay();
      resetListenTimer();
      renderRankingUI();

      if (player && player.loadVideoById) {
        player.loadVideoById(song.youtubeId);
      }
    }

    function renderRankingUI() {
      const listEl = document.getElementById('rank-list');
      listEl.innerHTML = '';
      const currentSong = currentPlaylist[currentIndex];

      let lastTier = null;

      songs.forEach((song, index) => {
        // ティアが変わったタイミングで見出しヘッダーを挿入
        if (song.tier !== lastTier) {
          const tierObj = TIER_DEFINITIONS.find(t => t.code === song.tier);
          const header = document.createElement('li');
          header.className = 'tier-header';
          header.innerText = `--- 🏆 Tier ${song.tier} : ${tierObj ? tierObj.name : ''} ---`;
          listEl.appendChild(header);
          lastTier = song.tier;
        }

        const li = document.createElement('li');
        li.className = 'rank-item';
        if (currentSong && song.id === currentSong.id) li.classList.add('active');

        li.onclick = () => {
          let idx = currentPlaylist.findIndex(s => s.id === song.id);
          if (idx !== -1) { currentIndex = idx; loadCurrentSong(); }
        };

        li.innerHTML = `
          <span class="rank-num">${index + 1}位</span>
          <span class="rank-tier-tag">${song.tier}</span>
          <span class="rank-name">${song.title}</span>
          <button class="rank-del-btn" onclick="deleteSong('${song.id}', event)">✕</button>
        `;
        listEl.appendChild(li);
      });
    }

    // 30%再生タイマー処理
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) startListeningTimer();
      else stopListeningTimer();
      if (event.data === YT.PlayerState.ENDED) nextSong();
    }

    function startListeningTimer() {
      stopListeningTimer();
      listenTimer = setInterval(() => {
        if (!player || !player.getDuration || isCountedCurrentSong) return;
        const duration = player.getDuration();
        if (duration <= 0) return;

        listenedSeconds++;
        if ((listenedSeconds / duration) >= 0.3) {
          const song = currentPlaylist[currentIndex];
          song.playCount++;
          isCountedCurrentSong = true;
          db.ref(`music_chart/songs/${song.id}/playCount`).set(song.playCount);
          stopListeningTimer();
        }
      }, 1000);
    }

    function stopListeningTimer() { if (listenTimer) clearInterval(listenTimer); listenTimer = null; }
    function resetListenTimer() { stopListeningTimer(); listenedSeconds = 0; isCountedCurrentSong = false; }

    // YouTube API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: '',
        playerVars: { 'playsinline': 1 },
        events: {
          'onReady': () => { if (currentPlaylist.length > 0) loadCurrentSong(); },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function nextSong() {
      if (currentPlaylist.length === 0) return;
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
      loadCurrentSong();
    }

    function prevSong() {
      if (currentPlaylist.length === 0) return;
      currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
      loadCurrentSong();
    }
  </script>
</body>
</html>
