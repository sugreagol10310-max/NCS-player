<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>NCS Music Player & Ranking Chart</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1, h2 { color: #00ffcc; }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    button {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 8px 12px;
      margin: 2px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #00cca3; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.active { background-color: #ffaa00; color: #000; }
    input, select, textarea {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 8px;
      border-radius: 4px;
      margin: 4px 0;
    }
    textarea { width: 100%; height: 80px; box-sizing: border-box; }
    .player-container { text-align: center; margin-bottom: 15px; }
    #player { width: 100%; max-width: 560px; height: 315px; background: #000; margin: 0 auto; }
    #seek-bar { width: 100%; max-width: 560px; margin-top: 8px; accent-color: #00ffcc; }

    ul.rank-list { list-style: none; padding: 0; }
    li.rank-item {
      background: #2a2a2a;
      margin-bottom: 6px;
      padding: 10px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    li.rank-item:hover { background: #333; }
    li.rank-item.active { border-left: 4px solid #00ffcc; background: #3a3a3a; }
    .tier-header {
      background: #333;
      color: #ffaa00;
      padding: 6px;
      font-weight: bold;
      margin-top: 10px;
      border-radius: 4px;
    }
    .rank-num { font-weight: bold; margin-right: 10px; width: 40px; }
    .rank-tier-tag {
      background: #444;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      margin-right: 10px;
    }
    .rank-name { flex-grow: 1; font-weight: bold; }
    .rank-del-btn { background: #ff4444; color: #fff; padding: 2px 6px; font-size: 10px; }

    #rank-search { width: 100%; box-sizing: border-box; margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background: #2a2a2a; padding: 8px; border-bottom: 2px solid #444; }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #00ffcc;
      color: #000;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 9999;
      max-width: 90%;
      text-align: center;
    }
    #toast.show { opacity: 1; }

    #sync-indicator {
      display: inline-block;
      font-size: 12px;
      color: #888;
      margin-left: 8px;
    }
  </style>
</head>
<body>

<div id="toast"></div>

<div class="container">
  <h1>🎵 NCS Music Player & Ranking Chart <span id="sync-indicator"></span></h1>

  <div class="card">
    <button class="mode-btn active" onclick="setMode('all', event)">全曲リスト</button>
    <button class="mode-btn" onclick="setMode('top20', event)">Top 20</button>
    <button class="mode-btn" onclick="setMode('bottom', event)">シャッフル再生</button>
    <button class="mode-btn" onclick="setMode('playCount', event)">再生数順</button>
    <button class="mode-btn" onclick="setMode('trending', event)">トレンド順</button>
    <button class="mode-btn" onclick="setMode('analytics', event)">📊 アナリティクス</button>
  </div>

  <div class="card player-container">
    <div id="player"></div>
    <input type="range" id="seek-bar" min="0" max="100" value="0" oninput="seekVideo(this.value)">
    <div style="margin-top: 10px;">
      <button id="prev-btn" onclick="prevSong()">⏮ 前の曲</button>
      <button id="play-pause-btn" onclick="togglePlayPause()">⏸ 一時停止</button>
      <button id="next-btn" onclick="nextSong()">⏭ 次の曲</button>
      <button id="reshuffle-btn" onclick="reshuffleNow()" style="display:none;">🔀 シャッフルし直す</button>
    </div>
    <div style="margin-top: 10px; text-align: left; background: #2a2a2a; padding: 10px; border-radius: 4px;">
      <div><strong>曲名:</strong> <span id="display-title">-</span></div>
      <div>
        再生数: <span id="display-plays">0</span>回 | 
        総再生時間: <span id="display-total-time">0分</span> | 
        維持率: <span id="display-retention">0%</span> | 
        リリース: <span id="display-year">-</span>年
      </div>
      <div>
        Tier: <span id="display-tier">-</span>
        <select id="select-tier" onchange="changeCurrentSongTier(this.value)"></select>
      </div>
      <div style="margin-top: 5px;">
        順位変更: 
        <input type="number" id="input-direct-rank" placeholder="順位" style="width: 60px;">
        <button onclick="moveCurrentSongToRank()">移動</button>
        <button onclick="moveCurrentSongStep(-1)">↑ 1つ上へ</button>
        <button onclick="moveCurrentSongStep(1)">↓ 1つ下へ</button>
      </div>
    </div>
  </div>

  <input type="text" id="rank-search" placeholder="🔍 曲名で検索..." oninput="renderRankingUI()">
  <ul id="rank-list" class="rank-list"></ul>

  <div id="analytics-container" class="card" style="display: none;">
    <h2>📊 期間別アナリティクス比較</h2>
    <div>
      <label>開始日: <select id="analytics-start-date" onchange="renderAnalyticsTable()"></select></label>
      <label>終了日: <select id="analytics-end-date" onchange="renderAnalyticsTable()"></select></label>
      <label>指標: 
        <select id="analytics-metric" onchange="renderAnalyticsTable()">
          <option value="playCount">再生回数 (回)</option>
          <option value="watchTime">総再生時間 (分)</option>
          <option value="retentionRate">維持率 (%)</option>
          <option value="trending">増加数トレンド</option>
        </select>
      </label>
      <button onclick="exportAnalyticsCSV()">CSV出力</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>順位</th>
          <th>曲名</th>
          <th>開始時点</th>
          <th>終了時点</th>
          <th>期間内変化</th>
        </tr>
      </thead>
      <tbody id="analytics-table-body"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>➕ 新規曲追加</h3>
    <input type="text" id="input-title" placeholder="曲名">
    <input type="text" id="input-ytid" placeholder="YouTube ID または URL">
    <input type="number" id="input-year" placeholder="リリース年 (例: 2024)" value="2024">
    <select id="input-tier"></select>
    <button onclick="addNewSong()">追加</button>

    <h3 style="margin-top: 20px;">📥 CSVインポート（データ加算）</h3>
    <textarea id="csv-input" placeholder="YouTube Analytics等のCSVデータを貼り付け"></textarea>
    <button onclick="importCSVData()">CSVからデータ加算</button>

    <h3 style="margin-top: 20px;">💾 バックアップ / 復元</h3>
    <button onclick="exportData()">JSONデータ保存</button>
    <input type="file" id="import-file" style="display:none;" onchange="importData(event)">
    <button onclick="document.getElementById('import-file').click()">JSONデータ復元</button>
  </div>
</div>

<script>
// --------------------------------------------------
// 🍞 トースト通知（alertの代わりに使う軽量通知）
// --------------------------------------------------
let toastTimer = null;
function showToast(message) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerText = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// --------------------------------------------------
// 🔥 ティア設定マスター定義
// --------------------------------------------------
const TIER_DEFINITIONS = [
  { code: "SSSS", name: "So Masterpiece", minScore: 100 },
  { code: "SS",   name: "Masterpiece",    minScore: 95 },
  { code: "S+",   name: "Brilliant",      minScore: 90 },
  { code: "S",    name: "Wonderful",      minScore: 80 },
  { code: "A+",   name: "Great",          minScore: 70 },
  { code: "A",    name: "Cool",           minScore: 60 },
  { code: "B+",   name: "Good",           minScore: 50 },
  { code: "B",    name: "Mid",            minScore: 40 },
  { code: "C+",   name: "Not Bad",        minScore: 30 },
  { code: "C",    name: "Meh",            minScore: 20 },
  { code: "D",    name: "Uncool",         minScore: 10 },
  { code: "E",    name: "Bad",            minScore: 5 },
  { code: "F",    name: "Too Bad",        minScore: 0 }
];

function scoreToTierCode(score) {
  for (let t of TIER_DEFINITIONS) {
    if (score >= t.minScore) return t.code;
  }
  return "F";
}

// --------------------------------------------------
// 🔥 Firebase設定
// --------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyCNrw2H5gjO7Ai_eOJxuwe6UzeG06l_MFQ",
  authDomain: "ncs-music-e2d05.firebaseapp.com",
  databaseURL: "https://ncs-music-e2d05-default-rtdb.firebaseio.com",
  projectId: "ncs-music-e2d05",
  storageBucket: "ncs-music-e2d05.firebasestorage.app",
  messagingSenderId: "211698967527",
  appId: "1:211698967527:web:3d856f269a6d445fda1342"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const songsRef = db.ref('music_chart/songs');
const historyRef = db.ref('music_chart/daily_history');

// --------------------------------------------------
// アプリ変数
// --------------------------------------------------
let songs = [];
let currentPlaylist = [];
let currentIndex = 0;
let player;
let currentMode = 'all';

// ★ 現在再生中の曲IDを「生きた変数」として保持する。
//   非同期処理(Firebase同期など)はこの値を「使う瞬間」に参照するため、
//   処理開始時点の古い値を掴んだまま巻き戻る、というバグが起きなくなる。
let currentSongId = null;

let listenedSeconds = 0;
let isCountedCurrentSong = false;
let listenTimer = null;
let isManualSelection = false;

// ★ 視聴データはこの曲オブジェクトに対して溜め込み、まとめてFirebaseへ送る
let activeListeningSong = null;
let pendingWatchSeconds = 0;
let pendingPlayIncrement = 0;
let pendingDurationUpdate = null;
const FLUSH_INTERVAL_SECONDS = 5; // 1秒ごとの書き込みをやめ、5秒ごと(または曲切替時)にまとめる

// ★ 曲送り中の多重発火（連打・自動送りとクリックの競合）を防ぐロック
let isTransitioning = false;

let pastSnapshotData = null;
let allHistoryData = {};
let analyticsCalculatedData = [];
let isInitialLoad = true;

// ★ シャッフル順のキャッシュ（毎回シャッフルし直さないようにする）
let shuffledOrderIds = null;

function initTierSelects() {
  const selectTier = document.getElementById('select-tier');
  const inputTier = document.getElementById('input-tier');
  if (!selectTier || !inputTier) return;
  selectTier.innerHTML = '';
  inputTier.innerHTML = '';

  TIER_DEFINITIONS.forEach(t => {
    const opt = `<option value="${t.code}">${t.code} (${t.name})</option>`;
    selectTier.innerHTML += opt;
    inputTier.innerHTML += opt;
  });
  inputTier.value = "A+";
}
initTierSelects();

// --------------------------------------------------
// 🔥 Firebaseリアルタイム同期
// --------------------------------------------------
function showSyncIndicator() {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  el.innerText = '🔄';
  clearTimeout(showSyncIndicator._t);
  showSyncIndicator._t = setTimeout(() => { el.innerText = ''; }, 600);
}

songsRef.on('value', (snapshot) => {
  showSyncIndicator();
  const data = snapshot.val();

  if (data) {
    let rawSongs = Object.keys(data).map(key => ({ id: key, ...data[key] }));
    rawSongs.sort((a, b) => (b.score || 0) - (a.score || 0));

    songs = rawSongs.map((s, idx) => {
      const duration = s.duration || 200;
      const playCount = s.playCount || 0;

      let totalWatchTime = s.totalWatchTime;
      if (totalWatchTime === undefined || totalWatchTime === null) {
        const effectivePlays = playCount > 0 ? playCount : 1;
        totalWatchTime = Math.round(duration * 0.5 * effectivePlays);
      }

      return {
        id: s.id,
        youtubeId: s.youtubeId,
        title: s.title,
        year: s.year || 2024,
        playCount: playCount,
        duration: duration,
        totalWatchTime: totalWatchTime,
        tier: s.tier || scoreToTierCode(s.score || 80),
        order: s.order !== undefined ? s.order : idx
      };
    });
  } else {
    songs = [];
  }

  sortSongs();
  updatePlaylistByMode();
  relocateCurrentSong();
  renderRankingUI();
  updateTrackInfoDisplay();
  checkAndSaveDailyHistory();

  if (isInitialLoad && currentPlaylist.length > 0) {
    isInitialLoad = false;

    // 履歴データの取得は「初回ロード時」だけ。以降はモード切替時と定期更新でのみ取得する。
    fetchPastHistory(() => {
      updatePlaylistByMode();
      relocateCurrentSong();
      renderRankingUI();
    });

    if (!player || !player.getVideoData) {
      loadCurrentSong(false);
    }
  }
});

// ★ currentSongId（今表示すべき曲）を、再構築後のcurrentPlaylistの中から
//   その都度「最新の値」で探し直す。決してcurrentIndexだけを信用しない。
function relocateCurrentSong() {
  if (!currentSongId) return;
  const idx = currentPlaylist.findIndex(s => s.id === currentSongId);
  if (idx !== -1) {
    currentIndex = idx;
  } else if (currentIndex >= currentPlaylist.length) {
    currentIndex = Math.max(0, currentPlaylist.length - 1);
  }
}

function saveAllToFirebase() {
  const dataObj = {};
  songs.forEach((s, index) => {
    s.order = index;
    dataObj[s.id] = s;
  });
  songsRef.set(dataObj);
}

function sortSongs() {
  songs.sort((a, b) => a.order - b.order);
  songs.forEach((s, i) => s.order = i);
}

function getRetentionRate(song) {
  if (!song || !song.playCount || !song.duration) return 0;
  const avgWatchTime = song.totalWatchTime / song.playCount;
  return Math.min((avgWatchTime / song.duration) * 100, 100);
}

// --------------------------------------------------
// 🕒 毎日 0:00 バックアップ
// --------------------------------------------------
let isSavingSnapshot = false;
let lastHistoryCheckDate = null;

function checkAndSaveDailyHistory() {
  if (songs.length === 0 || isSavingSnapshot) return;
  const now = new Date();
  const dateStr = now.toISOString().split('T')[0];

  if (lastHistoryCheckDate === dateStr) return; // 今日分は確認済みなら再チェックしない

  historyRef.child(dateStr).once('value', (snapshot) => {
    if (!snapshot.exists()) {
      saveDailySnapshot(dateStr);
    } else {
      lastHistoryCheckDate = dateStr;
    }
  });
}

function saveDailySnapshot(dateStr) {
  if (isSavingSnapshot) return;
  isSavingSnapshot = true;

  const snapshotData = {
    timestamp: firebase.database.ServerValue.TIMESTAMP,
    songs: {}
  };

  songs.forEach((song, idx) => {
    snapshotData.songs[song.id] = {
      title: song.title,
      playCount: song.playCount,
      totalWatchTime: song.totalWatchTime,
      duration: song.duration,
      retentionRate: Math.round(getRetentionRate(song)),
      tier: song.tier,
      order: song.order,
      rank: idx + 1
    };
  });

  historyRef.child(dateStr).set(snapshotData, () => {
    isSavingSnapshot = false;
    lastHistoryCheckDate = dateStr;
  });
}

function fetchPastHistory(callback) {
  historyRef.once('value', (snapshot) => {
    allHistoryData = snapshot.val() || {};
    pastSnapshotData = null;

    if (allHistoryData) {
      const dates = Object.keys(allHistoryData).sort();
      const todayStr = new Date().toISOString().split('T')[0];
      const validPastDates = dates.filter(d => d < todayStr);

      if (validPastDates.length > 0) {
        const pastTargetDate = new Date();
        pastTargetDate.setDate(pastTargetDate.getDate() - 7);
        const targetStr = pastTargetDate.toISOString().split('T')[0];

        const olderDates = validPastDates.filter(d => d <= targetStr);
        let chosenDate = (olderDates.length > 0) ? olderDates[olderDates.length - 1] : validPastDates[0];

        if (chosenDate) {
          pastSnapshotData = allHistoryData[chosenDate]?.songs || null;
        }
      }
    }

    initAnalyticsDropdowns();
    if (callback) callback();
  });
}

// 5分ごとにトレンド用の過去データを裏で更新（表示中がtrendingなら再描画）
setInterval(() => {
  fetchPastHistory(() => {
    if (currentMode === 'trending') {
      updatePlaylistByMode();
      relocateCurrentSong();
      renderRankingUI();
    }
  });
}, 5 * 60 * 1000);

// --------------------------------------------------
// 🔥 アナリティクス機能
// --------------------------------------------------
function initAnalyticsDropdowns() {
  const startDateSelect = document.getElementById('analytics-start-date');
  const endDateSelect = document.getElementById('analytics-end-date');
  if (!startDateSelect || !endDateSelect) return;

  const dates = Object.keys(allHistoryData).sort();
  const todayStr = new Date().toISOString().split('T')[0];

  if (!dates.includes(todayStr)) {
    dates.push(todayStr);
  }

  startDateSelect.innerHTML = '';
  endDateSelect.innerHTML = '';

  if (dates.length === 0) return;

  dates.forEach(d => {
    startDateSelect.innerHTML += `<option value="${d}">${d}</option>`;
    endDateSelect.innerHTML += `<option value="${d}">${d}</option>`;
  });

  startDateSelect.value = dates[0];
  endDateSelect.value = dates[dates.length - 1];
}

function getSongSnapshotData(dateStr, song, isEndDate) {
  const todayStr = new Date().toISOString().split('T')[0];

  if (isEndDate && dateStr === todayStr) {
    return {
      playCount: song.playCount || 0,
      totalWatchTime: song.totalWatchTime || 0,
      retentionRate: Math.round(getRetentionRate(song)),
      duration: song.duration
    };
  }

  const snap = allHistoryData[dateStr]?.songs?.[song.id];
  if (snap) {
    return {
      playCount: snap.playCount || 0,
      totalWatchTime: snap.totalWatchTime || 0,
      retentionRate: snap.retentionRate || 0,
      duration: snap.duration || song.duration
    };
  }

  return {
    playCount: song.playCount || 0,
    totalWatchTime: song.totalWatchTime || 0,
    retentionRate: Math.round(getRetentionRate(song)),
    duration: song.duration
  };
}

function renderAnalyticsTable() {
  const startDate = document.getElementById('analytics-start-date').value;
  const endDate = document.getElementById('analytics-end-date').value;
  const metric = document.getElementById('analytics-metric').value;
  const tableBody = document.getElementById('analytics-table-body');

  if (!startDate || !endDate) return;

  analyticsCalculatedData = songs.map(song => {
    const startData = getSongSnapshotData(startDate, song, false);
    const endData = getSongSnapshotData(endDate, song, true);

    let valStart = 0;
    let valEnd = 0;
    let valDiff = 0;
    let unit = '';

    if (metric === 'playCount') {
      valStart = startData.playCount || 0;
      valEnd = endData.playCount || 0;
      valDiff = valEnd - valStart;
      unit = '回';
    } else if (metric === 'watchTime') {
      valStart = Math.round((startData.totalWatchTime || 0) / 60);
      valEnd = Math.round((endData.totalWatchTime || 0) / 60);
      valDiff = valEnd - valStart;
      unit = '分';
    } else if (metric === 'retentionRate') {
      valStart = startData.retentionRate || 0;
      valEnd = endData.retentionRate || 0;
      valDiff = valEnd;
      unit = '%';
    } else if (metric === 'trending') {
      valStart = startData.playCount || 0;
      valEnd = endData.playCount || 0;
      valDiff = valEnd - valStart;
      unit = '回増加';
    }

    return { id: song.id, title: song.title, tier: song.tier, valStart, valEnd, valDiff, unit };
  });

  analyticsCalculatedData.sort((a, b) => b.valDiff - a.valDiff);

  tableBody.innerHTML = '';
  analyticsCalculatedData.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid #333';
    tr.innerHTML = `
      <td style="padding: 8px; text-align: center; color: #ffaa00; font-weight: bold;">${idx + 1}</td>
      <td style="padding: 8px; font-weight: bold;">${item.title}</td>
      <td style="padding: 8px; text-align: center; color: #888;">${item.valStart}${item.unit}</td>
      <td style="padding: 8px; text-align: center; color: #fff;">${item.valEnd}${item.unit}</td>
      <td style="padding: 8px; text-align: center; color: #00ffcc; font-weight: bold;">${item.valDiff > 0 ? '+' : ''}${item.valDiff}${item.unit}</td>
    `;
    tableBody.appendChild(tr);
  });
}

function exportAnalyticsCSV() {
  if (analyticsCalculatedData.length === 0) return showToast('データがありません。');
  const startDate = document.getElementById('analytics-start-date').value;
  const endDate = document.getElementById('analytics-end-date').value;
  const metricText = document.getElementById('analytics-metric').options[document.getElementById('analytics-metric').selectedIndex].text;

  let csvContent = `順位,曲名,Tier,開始日数値(${startDate}),終了日数値(${endDate}),期間内成果(${metricText})\n`;
  analyticsCalculatedData.forEach((item, idx) => {
    csvContent += `${idx + 1},"${item.title.replace(/"/g, '""')}",${item.tier},${item.valStart},${item.valEnd},${item.valDiff}\n`;
  });

  const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
  const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `analytics_${startDate}_to_${endDate}.csv`;
  a.click();
}

// --------------------------------------------------
// モード選択とソート処理
// --------------------------------------------------
function updatePlaylistByMode(forceReshuffle = false) {
  const analyticsContainer = document.getElementById('analytics-container');
  const rankList = document.getElementById('rank-list');
  const searchBox = document.getElementById('rank-search');

  if (currentMode === 'analytics') {
    if (analyticsContainer) analyticsContainer.style.display = 'block';
    if (rankList) rankList.style.display = 'none';
    if (searchBox) searchBox.style.display = 'none';
    renderAnalyticsTable();
    return;
  } else {
    if (analyticsContainer) analyticsContainer.style.display = 'none';
    if (rankList) rankList.style.display = 'block';
    if (searchBox) searchBox.style.display = 'block';
  }

  if (currentMode === 'top20') {
    currentPlaylist = songs.slice(0, 20);
  } else if (currentMode === 'bottom') {
    // ★ シャッフル順をキャッシュし、明示的な要求（forceReshuffle）がない限り
    //   毎回の再同期でシャッフルし直さないようにする。曲の増減にはIDベースで追従。
    const eligible = songs.slice(Math.floor(songs.length / 2));
    const eligibleIds = new Set(eligible.map(s => s.id));

    if (!shuffledOrderIds || forceReshuffle) {
      shuffledOrderIds = eligible.map(s => s.id).sort(() => Math.random() - 0.5);
    } else {
      shuffledOrderIds = shuffledOrderIds.filter(id => eligibleIds.has(id));
      eligible.forEach(s => { if (!shuffledOrderIds.includes(s.id)) shuffledOrderIds.push(s.id); });
    }
    currentPlaylist = shuffledOrderIds.map(id => songs.find(s => s.id === id)).filter(Boolean);
  } else if (currentMode === 'playCount') {
    currentPlaylist = [...songs].sort((a, b) => b.playCount - a.playCount);
  } else if (currentMode === 'trending') {
    currentPlaylist = [...songs].sort((a, b) => {
      const pastA = pastSnapshotData ? (pastSnapshotData[a.id]?.playCount || 0) : 0;
      const pastB = pastSnapshotData ? (pastSnapshotData[b.id]?.playCount || 0) : 0;
      return (b.playCount - pastB) - (a.playCount - pastA);
    });
  } else {
    currentPlaylist = [...songs];
  }
}

function setMode(mode, e) {
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
  e.target.classList.add('active');
  currentMode = mode;

  const reshuffleBtn = document.getElementById('reshuffle-btn');
  if (reshuffleBtn) reshuffleBtn.style.display = (mode === 'bottom') ? 'inline-block' : 'none';

  const proceed = () => {
    updatePlaylistByMode(mode === 'bottom');
    currentIndex = 0;
    if (currentMode !== 'analytics') {
      loadCurrentSong(true);
    }
  };

  if (mode === 'trending' || mode === 'analytics') {
    fetchPastHistory(proceed);
  } else {
    proceed();
  }
}

function reshuffleNow() {
  if (currentMode !== 'bottom' || isTransitioning) return;
  updatePlaylistByMode(true);
  currentIndex = 0;
  loadCurrentSong(true);
}

// --------------------------------------------------
// 📥 CSVインポート処理（ダブルクォーテーション・コロン・-ID完全対応）
// --------------------------------------------------
function importCSVData() {
  const rawText = document.getElementById('csv-input').value.trim();
  if (!rawText) return showToast('CSVテキストを貼り付けてください。');

  const lines = rawText.split(/\r?\n/);
  let updatedCount = 0;
  let ignoredCount = 0;

  function parseCSVLine(line) {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (c === ',' && !inQuotes) {
        result.push(cur.trim());
        cur = '';
      } else {
        cur += c;
      }
    }
    result.push(cur.trim());
    return result;
  }

  lines.forEach((line, index) => {
    if (index === 0 || !line.trim()) return;

    const cols = parseCSVLine(line);
    if (cols.length < 7) return;

    const cleanCols = cols.map(c => c.replace(/^"|"$/g, '').trim());
    const ytid = cleanCols[0];

    if (!ytid || ytid === '合計' || ytid === '総計' || ytid === 'Total') return;

    const durationSec = parseInt(cleanCols[3]) || 0;
    const csvPlays = parseInt(cleanCols[4]) || 0;
    const csvHours = parseFloat(cleanCols[6]) || 0;
    const csvWatchTimeSec = Math.round(csvHours * 3600);

    let existingSong = songs.find(s => s.youtubeId === ytid);

    if (existingSong) {
      existingSong.playCount += csvPlays;
      existingSong.totalWatchTime += csvWatchTimeSec;
      if (durationSec > 0) existingSong.duration = durationSec;
      updatedCount++;
    } else {
      ignoredCount++;
    }
  });

  saveAllToFirebase();
  document.getElementById('csv-input').value = '';
  showToast(`CSVインポート完了！ 加算:${updatedCount}件 / スキップ:${ignoredCount}件`);
}

// --------------------------------------------------
// UI表示 ＆ 操作
// --------------------------------------------------
function changeCurrentSongTier(newTier) {
  if (currentPlaylist.length === 0) return;
  const song = currentPlaylist[currentIndex];
  song.tier = newTier;
  db.ref(`music_chart/songs/${song.id}/tier`).set(newTier);
}

function moveCurrentSongToRank() {
  if (currentPlaylist.length === 0) return;
  const targetInput = document.getElementById('input-direct-rank');
  let targetRank = parseInt(targetInput.value);

  if (isNaN(targetRank) || targetRank < 1 || targetRank > songs.length) {
    return showToast(`1〜${songs.length}位の間で指定してください。`);
  }

  const song = currentPlaylist[currentIndex];
  const oldIndex = songs.findIndex(s => s.id === song.id);
  const newIndex = targetRank - 1;

  if (oldIndex !== -1) {
    songs.splice(oldIndex, 1);
    songs.splice(newIndex, 0, song);
    saveAllToFirebase();
    targetInput.value = '';
  }
}

function moveCurrentSongStep(step) {
  if (currentPlaylist.length === 0) return;
  const song = currentPlaylist[currentIndex];
  const oldIndex = songs.findIndex(s => s.id === song.id);
  const newIndex = oldIndex + step;

  if (newIndex >= 0 && newIndex < songs.length) {
    songs.splice(oldIndex, 1);
    songs.splice(newIndex, 0, song);
    saveAllToFirebase();
  }
}

function updateTrackInfoDisplay() {
  if (currentPlaylist.length === 0) {
    document.getElementById('display-title').innerText = "データがありません";
    return;
  }
  const song = currentPlaylist[currentIndex];
  if (song) {
    document.getElementById('display-title').innerText = song.title;
    document.getElementById('display-plays').innerText = song.playCount;
    document.getElementById('display-total-time').innerText = `${Math.round(song.totalWatchTime / 60)}分`;
    document.getElementById('display-retention').innerText = `${Math.round(getRetentionRate(song))}%`;
    document.getElementById('display-year').innerText = song.year;

    const tierObj = TIER_DEFINITIONS.find(t => t.code === song.tier) || { name: song.tier };
    document.getElementById('display-tier').innerText = `${song.tier} (${tierObj.name})`;
    document.getElementById('select-tier').value = song.tier;
    document.getElementById('input-direct-rank').placeholder = `${song.order + 1}位`;
  }
}

// --------------------------------------------------
// 🎧 視聴計測 ＆ YouTube API 連動
// --------------------------------------------------
function onPlayerStateChange(event) {
  const playPauseBtn = document.getElementById('play-pause-btn');

  if (event.data === YT.PlayerState.PLAYING) {
    if (playPauseBtn) playPauseBtn.innerText = '⏸ 一時停止';
    startListeningTimer();
  } else {
    if (playPauseBtn) playPauseBtn.innerText = '▶ 再生';
    stopListeningTimer();
  }

  if (event.data === YT.PlayerState.ENDED) {
    isManualSelection = false;
    setTimeout(() => { nextSong(); }, 200);
  }
}

function togglePlayPause() {
  if (!player || !player.getPlayerState) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

// ★ 視聴データはactiveListeningSong（開始時に固定した曲の参照）に対して溜め、
//   currentIndexが途中で変わっても誤った曲に書き込まれないようにする。
function startListeningTimer() {
  stopListeningTimer(); // 前の曲の分を先にflushしてから開始
  activeListeningSong = currentPlaylist[currentIndex] || null;

  listenTimer = setInterval(() => {
    if (!player || !player.getDuration || !activeListeningSong) return;
    const duration = player.getDuration();
    if (duration <= 0) return;

    const song = activeListeningSong;

    if (!song.duration || song.duration !== Math.round(duration)) {
      song.duration = Math.round(duration);
      pendingDurationUpdate = song.duration;
    }

    listenedSeconds++;
    song.totalWatchTime++;
    pendingWatchSeconds++;

    const threshold = isManualSelection ? 0.1 : 0.3;
    if (!isCountedCurrentSong && (listenedSeconds / duration) >= threshold) {
      song.playCount++;
      isCountedCurrentSong = true;
      pendingPlayIncrement = 1;
    }

    // 1秒ごとの書き込みをやめ、5秒ごと・再生カウント確定時にまとめて送る
    if (pendingWatchSeconds >= FLUSH_INTERVAL_SECONDS || pendingPlayIncrement) {
      flushListenData(song);
    }
  }, 1000);
}

function flushListenData(song) {
  if (!song) return;
  if (pendingWatchSeconds === 0 && !pendingPlayIncrement && pendingDurationUpdate === null) return;

  const updates = {};
  updates[`music_chart/songs/${song.id}/totalWatchTime`] = song.totalWatchTime;
  if (pendingPlayIncrement) updates[`music_chart/songs/${song.id}/playCount`] = song.playCount;
  if (pendingDurationUpdate !== null) updates[`music_chart/songs/${song.id}/duration`] = pendingDurationUpdate;

  db.ref().update(updates);

  pendingWatchSeconds = 0;
  pendingPlayIncrement = 0;
  pendingDurationUpdate = null;
}

function stopListeningTimer() {
  if (listenTimer) clearInterval(listenTimer);
  listenTimer = null;
  if (activeListeningSong) {
    flushListenData(activeListeningSong);
    activeListeningSong = null;
  }
}

function resetListenTimer() {
  stopListeningTimer();
  listenedSeconds = 0;
  isCountedCurrentSong = false;
}

window.addEventListener('beforeunload', () => {
  if (activeListeningSong) flushListenData(activeListeningSong);
});

// --------------------------------------------------
// 🎚 シークバー
// --------------------------------------------------
let seekBarTimer = null;
function seekVideo(percent) {
  if (!player || !player.getDuration) return;
  const duration = player.getDuration();
  if (!duration) return;
  player.seekTo(duration * (percent / 100), true);
}

function startSeekBarUpdater() {
  if (seekBarTimer) clearInterval(seekBarTimer);
  seekBarTimer = setInterval(() => {
    const bar = document.getElementById('seek-bar');
    if (!bar || !player || !player.getDuration || !player.getCurrentTime) return;
    if (document.activeElement === bar) return; // ユーザーがドラッグ中は上書きしない
    const duration = player.getDuration();
    if (!duration) return;
    bar.value = (player.getCurrentTime() / duration) * 100;
  }, 1000);
}

// --------------------------------------------------
// ランキング表示
// --------------------------------------------------
function renderRankingUI() {
  if (currentMode === 'analytics') return;

  const listEl = document.getElementById('rank-list');
  const searchInput = document.getElementById('rank-search');
  const searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : '';
  listEl.innerHTML = '';
  const currentSong = currentPlaylist[currentIndex];

  let lastTier = null;
  const targetList = (currentMode === 'playCount' || currentMode === 'trending') ? currentPlaylist : songs;

  targetList.forEach((song, index) => {
    if (searchTerm && !song.title.toLowerCase().includes(searchTerm)) return;

    if (currentMode !== 'playCount' && currentMode !== 'trending' && song.tier !== lastTier) {
      const tierObj = TIER_DEFINITIONS.find(t => t.code === song.tier);
      const header = document.createElement('li');
      header.className = 'tier-header';
      header.innerText = `--- 🏆 Tier ${song.tier} : ${tierObj ? tierObj.name : ''} ---`;
      listEl.appendChild(header);
      lastTier = song.tier;
    }

    const li = document.createElement('li');
    li.className = 'rank-item';
    if (currentSong && song.id === currentSong.id) li.classList.add('active');

    li.onclick = (e) => {
      e.stopPropagation();
      if (isTransitioning) return;
      let idx = currentPlaylist.findIndex(s => s.id === song.id);
      if (idx !== -1) {
        isManualSelection = true;
        currentIndex = idx;
        loadCurrentSong(true);
      }
    };

    let metaStatsHtml = '';
    if (currentMode === 'playCount') {
      metaStatsHtml = `<span style="font-size: 11px; color: #00ffcc; margin-right: 8px;">👀 ${song.playCount}回</span>`;
    } else if (currentMode === 'trending') {
      const pastPlays = pastSnapshotData ? (pastSnapshotData[song.id]?.playCount || 0) : 0;
      metaStatsHtml = `<span style="font-size: 11px; color: #ffaa00; font-weight: bold; margin-right: 8px;">🔥 +${song.playCount - pastPlays}回</span>`;
    }

    li.innerHTML = `
      <span class="rank-num">${index + 1}位</span>
      <span class="rank-tier-tag">${song.tier}</span>
      <span class="rank-name">${song.title}</span>
      ${metaStatsHtml}
      <button class="rank-del-btn" onclick="deleteSong('${song.id}', event)">✕</button>
    `;
    listEl.appendChild(li);
  });

  if (listEl.children.length === 0) {
    const empty = document.createElement('li');
    empty.style.cssText = 'padding:15px;color:#888;text-align:center;background:transparent;cursor:default;';
    empty.innerText = searchTerm ? '該当する曲が見つかりません' : '曲がありません';
    listEl.appendChild(empty);
  }
}

// --------------------------------------------------
// 曲の読み込み・切り替え
// --------------------------------------------------
function loadCurrentSong(shouldPlay = true) {
  if (!currentPlaylist || currentPlaylist.length === 0) return;
  if (currentIndex < 0 || currentIndex >= currentPlaylist.length) currentIndex = 0;

  const song = currentPlaylist[currentIndex];
  if (!song || !song.youtubeId) return;

  // ★ ここで即座に「今の曲」を確定させる。以降どんな非同期処理が来ても
  //   この値を基準に画面表示・ランキングが同期されるので巻き戻りが起きない。
  currentSongId = song.id;

  resetListenTimer();
  updateTrackInfoDisplay();
  renderRankingUI();

  const bar = document.getElementById('seek-bar');
  if (bar) bar.value = 0;

  if (player && typeof player.loadVideoById === 'function') {
    try {
      if (shouldPlay) player.loadVideoById(song.youtubeId);
      else player.cueVideoById(song.youtubeId);
    } catch (err) {
      console.warn("YouTube Player Error:", err);
    }
  } else {
    setTimeout(() => {
      if (player && typeof player.loadVideoById === 'function') {
        if (shouldPlay) player.loadVideoById(song.youtubeId);
        else player.cueVideoById(song.youtubeId);
      }
    }, 500);
  }
}

// YouTube Iframe API ロード
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: '',
    playerVars: { 'playsinline': 1, 'autoplay': 0 },
    events: {
      'onReady': () => {
        if (currentPlaylist.length > 0) loadCurrentSong(false);
        startSeekBarUpdater();
      },
      'onStateChange': onPlayerStateChange,
      'onError': () => { setTimeout(() => { nextSong(); }, 2000); }
    }
  });
}

function setNavButtonsDisabled(disabled) {
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  if (prevBtn) prevBtn.disabled = disabled;
  if (nextBtn) nextBtn.disabled = disabled;
}

function nextSong() {
  if (currentPlaylist.length === 0 || isTransitioning) return;
  isTransitioning = true;
  setNavButtonsDisabled(true);
  isManualSelection = false;
  currentIndex = (currentIndex + 1) % currentPlaylist.length;
  loadCurrentSong(true);
  setTimeout(() => { isTransitioning = false; setNavButtonsDisabled(false); }, 400);
}

function prevSong() {
  if (currentPlaylist.length === 0 || isTransitioning) return;
  isTransitioning = true;
  setNavButtonsDisabled(true);
  isManualSelection = false;
  currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
  loadCurrentSong(true);
  setTimeout(() => { isTransitioning = false; setNavButtonsDisabled(false); }, 400);
}

// --------------------------------------------------
// ⌨️ キーボードショートカット（← → で曲送り、スペースで再生/一時停止）
// --------------------------------------------------
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

  if (e.key === 'ArrowRight') { nextSong(); }
  else if (e.key === 'ArrowLeft') { prevSong(); }
  else if (e.key === ' ') { e.preventDefault(); togglePlayPause(); }
});

function addNewSong() {
  const titleInput = document.getElementById('input-title');
  let ytidInput = document.getElementById('input-ytid').value.trim();
  const yearInput = document.getElementById('input-year');
  const tierInput = document.getElementById('input-tier');

  if (!titleInput.value.trim() || !ytidInput) return showToast('入力してください');

  if (ytidInput.includes('v=')) ytidInput = ytidInput.split('v=')[1].split('&')[0];
  else if (ytidInput.includes('youtu.be/')) ytidInput = ytidInput.split('youtu.be/')[1].split('?')[0];

  const newId = Date.now().toString();
  const newSong = {
    id: newId,
    youtubeId: ytidInput,
    title: titleInput.value.trim(),
    year: parseInt(yearInput.value) || 2024,
    tier: tierInput.value,
    playCount: 0,
    duration: 200,
    totalWatchTime: 0,
    order: songs.length
  };

  db.ref(`music_chart/songs/${newId}`).set(newSong);
  titleInput.value = '';
  document.getElementById('input-ytid').value = '';
  showToast('曲を追加しました');
}

function deleteSong(id, e) {
  e.stopPropagation();
  if (confirm('削除しますか？')) {
    db.ref(`music_chart/songs/${id}`).remove();
  }
}

function exportData() {
  if (songs.length === 0) return showToast('保存するデータがありません。');
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songs, null, 2));
  const a = document.createElement('a');
  a.href = dataStr;
  a.download = `music_chart_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const importedSongs = JSON.parse(e.target.result);
      if (Array.isArray(importedSongs)) {
        if (confirm(`現在のデータを上書きし、${importedSongs.length}曲をFirebaseへ一括登録しますか？`)) {
          songs = importedSongs.map((s, idx) => ({
            ...s,
            tier: s.tier || scoreToTierCode(s.score || 80),
            order: idx
          }));
          saveAllToFirebase();
          showToast('Firebaseへのデータ復元完了！');
        }
      }
    } catch (err) {
      showToast('ファイルの読み込みに失敗しました。');
    }
  };
  reader.readAsText(file);
}
