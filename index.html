<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイソング プレイヤー</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    #player-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #ff0000;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <h1>🎵 マイプレイリスト プレイヤー</h1>

  <div id="player-container">
    <div id="player"></div>
  </div>

  <div class="controls">
    <button onclick="prevVideo()">前の曲</button>
    <button onclick="nextVideo()">次の曲</button>
  </div>

  <script>
    // 1. 好きなYouTube動画の「動画ID」を配列に指定します
    // ※ 動画URLの「v=XXXXXX」の「XXXXXX」の部分です
    const playlist = [
      'dQw4w9WgXcQ', // 曲1の動画ID
      'kJQP7kiw5Fk', // 曲2の動画ID
      'fJ9rUzIMcZQ'  // 曲3の動画ID
    ];

    let currentTrackIndex = 0;
    let player;

    // 2. YouTube IFrame Player APIの読み込み
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // 3. プレイヤーの初期化
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: playlist[currentTrackIndex],
        playerVars: {
          'playsinline': 1,
          'autoplay': 0
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 4. 曲が終わったら自動で次の曲へ移行
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        nextVideo();
      }
    }

    // 次の曲を再生する関数
    function nextVideo() {
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      player.loadVideoById(playlist[currentTrackIndex]);
    }

    // 前の曲を再生する関数
    function prevVideo() {
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      player.loadVideoById(playlist[currentTrackIndex]);
    }
  </script>

</body>
</html>
