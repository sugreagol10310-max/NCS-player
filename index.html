<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Chart Master (Tier & Direct Rank)</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; font-size: 22px; }
    .mode-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .mode-btn { padding: 8px 16px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 20px; cursor: pointer; }
    .mode-btn.active { background: #ff0055; border-color: #ff0055; }
    .main-container { display: flex; gap: 20px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
    .left-panel { flex: 1 1 500px; display: flex; flex-direction: column; gap: 15px; }
    .player-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
    .track-info, .panel { background: #1e1e1e; padding: 15px; border-radius: 10px; }
    .track-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 8px; }
    .track-meta { font-size: 13px; color: #aaa; display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .track-meta span { background: #2a2a2a; padding: 4px 8px; border-radius: 4px; }
    
    /* ティア＆順位操作エリア */
    .tier-control { display: flex; flex-direction: column; gap: 10px; background: #2a2a2a; padding: 12px; border-radius: 8px; }
    .tier-display-box { display: flex; align-items: center; justify-content: space-between; }
    .tier-badge { font-size: 18px; font-weight: bold; color: #ffcc00; }
    .rank-move-box { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
    .rank-input { width: 70px; padding: 6px; background: #121212; border: 1px solid #555; border-radius: 4px; color: #fff; text-align: center; }
    
    .btn { padding: 6px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
    .btn:hover { background: #444; }
    .btn-action { background: #ff0055; border: none; font-weight: bold; }
    .nav-controls { display: flex; gap: 10px; margin-top: 10px; }
    .nav-btn { flex: 1; padding: 10px; background: #ff0055; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-row { display: flex; gap: 10px; }
    input, select, textarea { padding: 8px; background: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: #fff; flex: 1; }
    textarea { font-family: monospace; font-size: 11px; resize: vertical; height: 80px; }
    .btn-add { background: #00aa55; color: #fff; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .backup-controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-backup { flex: 1; padding: 8px; background: #3a3a3a; color: #ccc; border: 1px solid #555; border-radius: 5px; cursor: pointer; font-size: 13px; }
    .btn-backup:hover { background: #555; color: #fff; }
    
    .right-panel { flex: 1 1 350px; background: #1e1e1e; border-radius: 10px; padding: 15px; max-height: 850px; display: flex; flex-direction: column; }
    .ranking-title { font-size: 16px; margin-bottom: 10px; color: #fff; border-bottom: 1px solid #333; padding-bottom: 5px; }
    .rank-list { list-style: none; overflow-y: auto; flex: 1; }
    
    /* ティア区切りヘッダー */
    .tier-header { background: #2a1122; color: #ff0055; font-weight: bold; padding: 6px 10px; font-size: 12px; border-left: 4px solid #ff0055; margin-top: 8px; margin-bottom: 4px; }
    .rank-item { display: flex; align-items: center; padding: 8px 10px; border-bottom: 1px solid #2a2a2a; font-size: 14px; border-radius: 5px; cursor: pointer; }
    .rank-item.active { background: #331122; border: 1px solid #ff0055; }
    .rank-num { width: 40px; font-weight: bold; color: #888; }
    .rank-item.active .rank-num { color: #ff0055; }
    .rank-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
    .rank-tier-tag { font-size: 11px; background: #333; color: #ffcc00; padding: 2px 6px; border-radius: 3px; margin-right: 8px; font-weight: bold; }
    .rank-del-btn { background: transparent; border: none; color: #666; cursor: pointer; }
  </style>
</head>
<body>

  <h1>🎵 My Music Chart Master (Tier System)</h1>

  <div class="mode-selector">
    <button class="mode-btn active" onclick="setMode('all', event)">全曲順</button>
    <button class="mode-btn" onclick="setMode('top20', event)">TOP 20</button>
    <button class="mode-btn" onclick="setMode('bottom', event)">育成</button>
    <button class="mode-btn" onclick="setMode('playCount', event)">再生回数</button>
    <button class="mode-btn" onclick="setMode('trending', event)">急上昇</button>
    <button class="mode-btn" onclick="setMode('analytics', event)">アナリティクス</button>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="player-wrapper"><div id="player"></div></div>

      <div class="track-info">
        <div class="track-title" id="display-title">読み込み中...</div>
        <div class="track-meta">
          <span>👁 視聴: <strong id="display-plays">0</strong> 回</span>
          <span>⏱️ 総時間: <strong id="display-total-time">0分</strong></span>
          <span>📊 平均完聴率: <strong id="display-retention" style="color:#00ffcc;">0%</strong></span>
          <span>📅 年: <strong id="display-year">-</strong></span>
        </div>
        
        <div class="tier-control">
          <div class="tier-display-box">
            <span>🏆 ランク: <span class="tier-badge" id="display-tier">-</span></span>
            <div>
              <label style="font-size:12px; color:#aaa;">ティア変更: </label>
              <select id="select-tier" onchange="changeCurrentSongTier(this.value)" style="padding: 4px; font-size: 12px; flex:none; width: auto;">
              </select>
            </div>
          </div>
          <div class="rank-move-box">
            <span style="font-size:13px; color:#aaa;">順位指定:</span>
            <input type="number" id="input-direct-rank" class="rank-input" min="1" placeholder="位">
            <button class="btn btn-action" onclick="moveCurrentSongToRank()">移動</button>
            <button class="btn" onclick="moveCurrentSongStep(-1)">▲ 上へ</button>
            <button class="btn" onclick="moveCurrentSongStep(1)">▼ 下へ</button>
          </div>
        </div>

        <div class="nav-controls">
          <button class="nav-btn" onclick="prevSong()">前の曲</button>
          <button class="nav-btn" onclick="nextSong()">次の曲</button>
        </div>
      </div>

      <div class="panel">
        <div style="font-weight:bold; margin-bottom:8px; color:#ffcc00;">📥 CSV過去データ一括加算インポート</div>
        <div class="form-group">
          <textarea id="csv-input" placeholder="ここにYouTube AnalyticsのCSVテキスト（ヘッダー付き）をそのまま貼り付けてください"></textarea>
          <button class="btn-add" style="background:#0088ff;" onclick="importCSVData()">CSVからデータを取り込んで加算</button>
        </div>
      </div>

      <div class="panel">
        <div style="font-weight:bold; margin-bottom:10px;">➕ 楽曲を手動追加</div>
        <div class="form-group">
          <input type="text" id="input-title" placeholder="タイトル">
          <input type="text" id="input-ytid" placeholder="YouTube URL または ID">
          <div class="form-row">
            <input type="number" id="input-year" placeholder="年" value="2024">
            <select id="input-tier">
            </select>
          </div>
          <button class="btn-add" onclick="addNewSong()">追加</button>
        </div>
      </div>

      <div class="panel">
        <div style="font-weight:bold; margin-bottom:10px;">💾 データ管理 (Firebase同期)</div>
        <div class="backup-controls">
          <button class="btn-backup" onclick="exportData()">バックアップ保存 (.json)</button>
          <button class="btn-backup" onclick="document.getElementById('import-file').click()">復元 (JSONを読み込み)</button>
          <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
        </div>
      </div>
    </div>

    <div id="analytics-container" style="display: none; background: #1a1a1a; padding: 15px; border-radius: 8px; margin-top: 10px;">
      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center;">
        <div>
          <label style="font-size: 12px; color: #aaa; display: block;">① 開始日</label>
          <select id="analytics-start-date" onchange="renderAnalyticsTable()" style="background: #333; color: #fff; padding: 5px; border-radius: 4px; border: 1px solid #555;"></select>
        </div>
        <div>
          <label style="font-size: 12px; color: #aaa; display: block;">② 終了日</label>
          <select id="analytics-end-date" onchange="renderAnalyticsTable()" style="background: #333; color: #fff; padding: 5px; border-radius: 4px; border: 1px solid #555;"></select>
        </div>
        <div>
          <label style="font-size: 12px; color: #aaa; display: block;">③ 指標（分析対象）</label>
          <select id="analytics-metric" onchange="renderAnalyticsTable()" style="background: #333; color: #fff; padding: 5px; border-radius: 4px; border: 1px solid #555;">
            <option value="playCount">視聴回数の増加</option>
            <option value="watchTime">視聴時間の増加 (分)</option>
            <option value="retentionRate">平均完聴率 (%)</option>
            <option value="trending">急上昇回数 (視聴増加数)</option>
          </select>
        </div>
        <div style="margin-left: auto; align-self: flex-end;">
          <button onclick="exportAnalyticsCSV()" style="background: #00cc88; color: #000; border: none; padding: 7px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">📥 CSVエクスポート</button>
        </div>
      </div>
    
      <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
        <thead>
          <tr style="background: #2a2a2a; color: #aaa; border-bottom: 2px solid #444;">
            <th style="padding: 8px; width: 50px;">順位</th>
            <th style="padding: 8px; text-align: left;">曲名</th>
            <th style="padding: 8px; width: 100px;">開始日数値</th>
            <th style="padding: 8px; width: 100px;">終了日数値</th>
            <th style="padding: 8px; width: 110px;">期間内成果</th>
          </tr>
        </thead>
        <tbody id="analytics-table-body">
          </tbody>
      </table>
    </div>

    <div class="right-panel">
      <div class="ranking-title">🏆 ランキング (リアルタイム同期中)</div>
      <ul class="rank-list" id="rank-list"></ul>
    </div>
  </div>

  <script>
    // --------------------------------------------------
    // 🔥 ティア設定マスター定義
    // --------------------------------------------------
    const TIER_DEFINITIONS = [
      { code: "SSSS", name: "So Masterpiece", minScore: 100 },
      { code: "SS",   name: "Masterpiece",    minScore: 95 },
      { code: "S+",   name: "Brilliant",      minScore: 90 },
      { code: "S",    name: "Wonderful",      minScore: 80 },
      { code: "A+",   name: "Great",          minScore: 70 },
      { code: "A",    name: "Cool",           minScore: 60 },
      { code: "B+",   name: "Good",           minScore: 50 },
      { code: "B",    name: "Mid",            minScore: 40 },
      { code: "C+",   name: "Not Bad",        minScore: 30 },
      { code: "C",    name: "Meh",            minScore: 20 },
      { code: "D",    name: "Uncool",         minScore: 10 },
      { code: "E",    name: "Bad",            minScore: 5 },
      { code: "F",    name: "Too Bad",        minScore: 0 }
    ];
    
    function scoreToTierCode(score) {
      for (let t of TIER_DEFINITIONS) {
        if (score >= t.minScore) return t.code;
      }
      return "F";
    }
    
    // --------------------------------------------------
    // 🔥 Firebase設定
    // --------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCNrw2H5gjO7Ai_eOJxuwe6UzeG06l_MFQ",
      authDomain: "ncs-music-e2d05.firebaseapp.com",
      databaseURL: "https://ncs-music-e2d05-default-rtdb.firebaseio.com",
      projectId: "ncs-music-e2d05",
      storageBucket: "ncs-music-e2d05.firebasestorage.app",
      messagingSenderId: "211698967527",
      appId: "1:211698967527:web:3d856f269a6d445fda1342"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const songsRef = db.ref('music_chart/songs');
    const historyRef = db.ref('music_chart/daily_history');
    
    // --------------------------------------------------
    // アプリ変数
    // --------------------------------------------------
    let songs = [];
    let currentPlaylist = [];
    let currentIndex = 0;
    let player;
    let currentMode = 'all';
    
    let listenedSeconds = 0;
    let isCountedCurrentSong = false;
    let listenTimer = null;
    let isManualSelection = false; 
    
    let pastSnapshotData = null;
    let allHistoryData = {}; // 🔥 全履歴データ保持用
    let analyticsCalculatedData = []; // 🔥 アナリティクス計算結果保持用
    
    function initTierSelects() {
      const selectTier = document.getElementById('select-tier');
      const inputTier = document.getElementById('input-tier');
      if (!selectTier || !inputTier) return;
      selectTier.innerHTML = '';
      inputTier.innerHTML = '';
    
      TIER_DEFINITIONS.forEach(t => {
        const opt = `<option value="${t.code}">${t.code} (${t.name})</option>`;
        selectTier.innerHTML += opt;
        inputTier.innerHTML += opt;
      });
      inputTier.value = "A+";
    }
    initTierSelects();
    
    // 🔥 Firebaseからリアルタイム取得
    songsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const currentSongId = currentPlaylist[currentIndex] ? currentPlaylist[currentIndex].id : null;
    
      if (data) {
        let rawSongs = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        rawSongs.sort((a, b) => (b.score || 0) - (a.score || 0));
        
        songs = rawSongs.map((s, idx) => {
          const duration = s.duration || 200;
          const playCount = s.playCount || 0;
          
          let totalWatchTime = s.totalWatchTime;
          if (totalWatchTime === undefined || totalWatchTime === null) {
            const effectivePlays = playCount > 0 ? playCount : 1;
            totalWatchTime = Math.round(duration * 0.5 * effectivePlays);
          }
    
          return {
            id: s.id,
            youtubeId: s.youtubeId,
            title: s.title,
            year: s.year || 2024,
            playCount: playCount,
            duration: duration,
            totalWatchTime: totalWatchTime,
            tier: s.tier || scoreToTierCode(s.score || 80),
            order: s.order !== undefined ? s.order : idx
          };
        });
      } else {
        songs = [];
      }
    
      sortSongs();
    
      fetchPastHistory(() => {
        updatePlaylistByMode();
    
        if (currentSongId) {
          const newIndex = currentPlaylist.findIndex(s => s.id === currentSongId);
          if (newIndex !== -1) currentIndex = newIndex;
        }
    
        renderRankingUI();
        updateTrackInfoDisplay();
    
        if (currentPlaylist.length > 0 && (!player || !player.getVideoData)) {
          loadCurrentSong();
        }
    
        checkAndSaveDailyHistory();
      });
    });
    
    function saveAllToFirebase() {
      const dataObj = {};
      songs.forEach((s, index) => {
        s.order = index;
        dataObj[s.id] = s;
      });
      songsRef.set(dataObj);
    }
    
    function sortSongs() {
      songs.sort((a, b) => a.order - b.order);
      songs.forEach((s, i) => s.order = i);
    }
    
    function getRetentionRate(song) {
      if (!song || !song.playCount || !song.duration) return 0;
      const avgWatchTime = song.totalWatchTime / song.playCount;
      return Math.min((avgWatchTime / song.duration) * 100, 100);
    }
    
    // --------------------------------------------------
    // 🕒 毎日 0:00 自動バックアップ ＆ 過去ログ取得
    // --------------------------------------------------
    function checkAndSaveDailyHistory() {
      if (songs.length === 0) return;
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
    
      historyRef.child(dateStr).once('value', (snapshot) => {
        if (!snapshot.exists()) {
          saveDailySnapshot(dateStr);
        }
      });
    }
    
    function saveDailySnapshot(dateStr) {
      const snapshotData = {
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        songs: {}
      };
    
      songs.forEach((song, idx) => {
        snapshotData.songs[song.id] = {
          title: song.title,
          playCount: song.playCount,
          totalWatchTime: song.totalWatchTime,
          duration: song.duration,
          retentionRate: Math.round(getRetentionRate(song)),
          tier: song.tier,
          order: song.order,
          rank: idx + 1
        };
      });
    
      historyRef.child(dateStr).set(snapshotData);
    }
    
    function fetchPastHistory(callback) {
      historyRef.once('value', (snapshot) => {
        allHistoryData = snapshot.val() || {};
        pastSnapshotData = null;
    
        if (allHistoryData) {
          const dates = Object.keys(allHistoryData).sort();
          const todayStr = new Date().toISOString().split('T')[0];
          const validPastDates = dates.filter(d => d < todayStr);
    
          if (validPastDates.length > 0) {
            const pastTargetDate = new Date();
            pastTargetDate.setDate(pastTargetDate.getDate() - 7);
            const targetStr = pastTargetDate.toISOString().split('T')[0];
    
            const olderDates = validPastDates.filter(d => d <= targetStr);
            let chosenDate = (olderDates.length > 0) ? olderDates[olderDates.length - 1] : validPastDates[0];
    
            if (chosenDate) {
              pastSnapshotData = allHistoryData[chosenDate]?.songs || null;
            }
          }
        }
        
        // アナリティクスの日付プルダウンを初期化
        initAnalyticsDropdowns();
    
        if (callback) callback();
      });
    }
    
    function scheduleMidnightTask() {
      const now = new Date();
      const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
      const msToMidnight = nextMidnight.getTime() - now.getTime();
    
      setTimeout(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        saveDailySnapshot(todayStr);
        scheduleMidnightTask();
      }, msToMidnight);
    }
    scheduleMidnightTask();
    
    // --------------------------------------------------
    // 🔥 アナリティクス機能
    // --------------------------------------------------
    function initAnalyticsDropdowns() {
      const startDateSelect = document.getElementById('analytics-start-date');
      const endDateSelect = document.getElementById('analytics-end-date');
      if (!startDateSelect || !endDateSelect) return;
    
      const dates = Object.keys(allHistoryData).sort();
      const todayStr = new Date().toISOString().split('T')[0];
      
      // 今日のリアルタイムデータも日付一覧に含める
      if (!dates.includes(todayStr)) {
        dates.push(todayStr);
      }
    
      startDateSelect.innerHTML = '';
      endDateSelect.innerHTML = '';
    
      if (dates.length === 0) {
        startDateSelect.innerHTML = '<option value="">データなし</option>';
        endDateSelect.innerHTML = '<option value="">データなし</option>';
        return;
      }
    
      dates.forEach(d => {
        startDateSelect.innerHTML += `<option value="${d}">${d}</option>`;
        endDateSelect.innerHTML += `<option value="${d}">${d}</option>`;
      });
    
      // デフォルト値: 開始日=一番古い日（または7日前）, 終了日=最新日
      startDateSelect.value = dates[0];
      endDateSelect.value = dates[dates.length - 1];
    }
    
    function getSongSnapshotData(dateStr, song) {
      const todayStr = new Date().toISOString().split('T')[0];
      if (dateStr === todayStr) {
        return {
          playCount: song.playCount,
          totalWatchTime: song.totalWatchTime,
          retentionRate: Math.round(getRetentionRate(song)),
          duration: song.duration
        };
      }
      const snap = allHistoryData[dateStr]?.songs?.[song.id];
      return snap || { playCount: 0, totalWatchTime: 0, retentionRate: 0, duration: song.duration };
    }
    
    function renderAnalyticsTable() {
      const startDate = document.getElementById('analytics-start-date').value;
      const endDate = document.getElementById('analytics-end-date').value;
      const metric = document.getElementById('analytics-metric').value;
      const tableBody = document.getElementById('analytics-table-body');
    
      if (!startDate || !endDate) return;
    
      analyticsCalculatedData = songs.map(song => {
        const startData = getSongSnapshotData(startDate, song);
        const endData = getSongSnapshotData(endDate, song);
    
        let valStart = 0;
        let valEnd = 0;
        let valDiff = 0;
        let unit = '';
    
        if (metric === 'playCount') {
          valStart = startData.playCount || 0;
          valEnd = endData.playCount || 0;
          valDiff = valEnd - valStart;
          unit = '回';
        } else if (metric === 'watchTime') {
          valStart = Math.round((startData.totalWatchTime || 0) / 60);
          valEnd = Math.round((endData.totalWatchTime || 0) / 60);
          valDiff = valEnd - valStart;
          unit = '分';
        } else if (metric === 'retentionRate') {
          valStart = startData.retentionRate || 0;
          valEnd = endData.retentionRate || 0;
          valDiff = valEnd; // 完聴率は終了日時点の値で評価
          unit = '%';
        } else if (metric === 'trending') {
          valStart = startData.playCount || 0;
          valEnd = endData.playCount || 0;
          valDiff = valEnd - valStart;
          unit = '回増加';
        }
    
        return {
          id: song.id,
          title: song.title,
          tier: song.tier,
          valStart,
          valEnd,
          valDiff,
          unit
        };
      });
    
      // 数値が高い順（降順）にソート
      analyticsCalculatedData.sort((a, b) => b.valDiff - a.valDiff);
    
      tableBody.innerHTML = '';
      analyticsCalculatedData.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid #333';
        tr.innerHTML = `
          <td style="padding: 8px; text-align: center; color: #ffaa00; font-weight: bold;">${idx + 1}</td>
          <td style="padding: 8px; font-weight: bold;">${item.title}</td>
          <td style="padding: 8px; text-align: center; color: #888;">${item.valStart}${item.unit}</td>
          <td style="padding: 8px; text-align: center; color: #fff;">${item.valEnd}${item.unit}</td>
          <td style="padding: 8px; text-align: center; color: #00ffcc; font-weight: bold;">${item.valDiff > 0 ? '+' : ''}${item.valDiff}${item.unit}</td>
        `;
        tableBody.appendChild(tr);
      });
    }
    
    function exportAnalyticsCSV() {
      if (analyticsCalculatedData.length === 0) return alert('エクスポートするデータがありません。');
    
      const startDate = document.getElementById('analytics-start-date').value;
      const endDate = document.getElementById('analytics-end-date').value;
      const metricText = document.getElementById('analytics-metric').options[document.getElementById('analytics-metric').selectedIndex].text;
    
      let csvContent = `順位,曲名,Tier,開始日数値(${startDate}),終了日数値(${endDate}),期間内成果(${metricText})\n`;
    
      analyticsCalculatedData.forEach((item, idx) => {
        csvContent += `${idx + 1},"${item.title.replace(/"/g, '""')}",${item.tier},${item.valStart},${item.valEnd},${item.valDiff}\n`;
      });
    
      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]); // UTF-8 BOM（Excel文字化け防止）
      const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
    
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", url);
      downloadAnchor.setAttribute("download", `analytics_${startDate}_to_${endDate}.csv`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
    
    // --------------------------------------------------
    // モード選択とソート処理
    // --------------------------------------------------
    function updatePlaylistByMode() {
      const analyticsContainer = document.getElementById('analytics-container');
      const rankList = document.getElementById('rank-list');
    
      if (currentMode === 'analytics') {
        if (analyticsContainer) analyticsContainer.style.display = 'block';
        if (rankList) rankList.style.display = 'none';
        renderAnalyticsTable();
        return;
      } else {
        if (analyticsContainer) analyticsContainer.style.display = 'none';
        if (rankList) rankList.style.display = 'block';
      }
    
      if (currentMode === 'top20') {
        currentPlaylist = songs.slice(0, 20);
      } else if (currentMode === 'bottom') {
        currentPlaylist = songs.slice(Math.floor(songs.length / 2)).sort(() => Math.random() - 0.5);
      } else if (currentMode === 'playCount') {
        currentPlaylist = [...songs].sort((a, b) => {
          if (b.playCount !== a.playCount) return b.playCount - a.playCount;
          const retA = getRetentionRate(a);
          const retB = getRetentionRate(b);
          if (retB !== retA) return retB - retA;
          return a.title.localeCompare(b.title, 'en', { sensitivity: 'base' });
        });
      } else if (currentMode === 'trending') {
        currentPlaylist = [...songs].sort((a, b) => {
          const pastA = pastSnapshotData ? (pastSnapshotData[a.id]?.playCount || 0) : 0;
          const pastB = pastSnapshotData ? (pastSnapshotData[b.id]?.playCount || 0) : 0;
          
          const diffA = a.playCount - pastA;
          const diffB = b.playCount - pastB;
    
          if (diffB !== diffA) return diffB - diffA;
          if (b.playCount !== a.playCount) return b.playCount - a.playCount;
          const retA = getRetentionRate(a);
          const retB = getRetentionRate(b);
          if (retB !== retA) return retB - retA;
          return a.title.localeCompare(b.title, 'en', { sensitivity: 'base' });
        });
      } else {
        currentPlaylist = [...songs];
      }
    }
    
    function setMode(mode, e) {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      currentMode = mode;
      updatePlaylistByMode();
      currentIndex = 0;
      if (currentMode !== 'analytics') loadCurrentSong();
    }

    // --------------------------------------------------
    // CSV加算インポート処理（完全対応版パーサー）
    // --------------------------------------------------
    function importCSVData() {
      const rawText = document.getElementById('csv-input').value.trim();
      if (!rawText) return alert('CSVテキストを貼り付けてください。');
    
      const lines = rawText.split(/\r?\n/);
      let updatedCount = 0;
      let ignoredCount = 0;
    
      // CSVの1行を正確に配列に分解する関数
      function parseCSVLine(line) {
        const result = [];
        let cur = '';
        let inQuotes = false;
    
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') {
            if (inQuotes && line[i + 1] === '"') {
              cur += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (c === ',' && !inQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += c;
          }
        }
        result.push(cur.trim());
        return result;
      }
    
      lines.forEach((line, index) => {
        if (index === 0 || !line.trim()) return; // ヘッダー行や空行をスキップ
    
        const cols = parseCSVLine(line);
        if (cols.length < 7) return;
    
        // 前後のダブルクォーテーションを除去
        const cleanCols = cols.map(c => c.replace(/^"|"$/g, '').trim());
    
        const ytid = cleanCols[0];
        if (!ytid || ytid === '合計' || ytid.startsWith('-')) return;
    
        // データの取得
        const durationSec = parseInt(cleanCols[3]) || 0;     // 229
        const csvPlays = parseInt(cleanCols[4]) || 0;        // 47
        const csvHours = parseFloat(cleanCols[6]) || 0;      // 2.0971
        const csvWatchTimeSec = Math.round(csvHours * 3600); // 秒に換算
    
        let existingSong = songs.find(s => s.youtubeId === ytid);
    
        if (existingSong) {
          existingSong.playCount += csvPlays;
          existingSong.totalWatchTime += csvWatchTimeSec;
          if (durationSec > 0) existingSong.duration = durationSec;
          updatedCount++;
        } else {
          ignoredCount++;
        }
      });
    
      saveAllToFirebase();
      document.getElementById('csv-input').value = '';
      alert(`CSVインポート完了！\n・既存曲のデータ更新(加算): ${updatedCount} 件\n・無視（スキップした新曲）: ${ignoredCount} 件`);
    }
    
    // --------------------------------------------------
    // UI表示 ＆ トラック変更処理
    // --------------------------------------------------
    function changeCurrentSongTier(newTier) {
      if (currentPlaylist.length === 0) return;
      const song = currentPlaylist[currentIndex];
      song.tier = newTier;
      db.ref(`music_chart/songs/${song.id}/tier`).set(newTier);
    }
    
    function moveCurrentSongToRank() {
      if (currentPlaylist.length === 0) return;
      const targetInput = document.getElementById('input-direct-rank');
      let targetRank = parseInt(targetInput.value);
    
      if (isNaN(targetRank) || targetRank < 1 || targetRank > songs.length) {
        return alert(`1〜${songs.length}位の間で指定してください。`);
      }
    
      const song = currentPlaylist[currentIndex];
      const oldIndex = songs.findIndex(s => s.id === song.id);
      const newIndex = targetRank - 1;
    
      if (oldIndex !== -1) {
        songs.splice(oldIndex, 1);
        songs.splice(newIndex, 0, song);
        saveAllToFirebase();
        targetInput.value = '';
      }
    }
    
    function moveCurrentSongStep(step) {
      if (currentPlaylist.length === 0) return;
      const song = currentPlaylist[currentIndex];
      const oldIndex = songs.findIndex(s => s.id === song.id);
      const newIndex = oldIndex + step;
    
      if (newIndex >= 0 && newIndex < songs.length) {
        songs.splice(oldIndex, 1);
        songs.splice(newIndex, 0, song);
        saveAllToFirebase();
      }
    }
    
    function updateTrackInfoDisplay() {
      if (currentPlaylist.length === 0) {
        document.getElementById('display-title').innerText = "データがありません";
        return;
      }
      const song = currentPlaylist[currentIndex];
      if (song) {
        document.getElementById('display-title').innerText = song.title;
        document.getElementById('display-plays').innerText = song.playCount;
        
        const totalMinutes = Math.round(song.totalWatchTime / 60);
        document.getElementById('display-total-time').innerText = `${totalMinutes}分`;
    
        const retention = Math.round(getRetentionRate(song));
        document.getElementById('display-retention').innerText = `${retention}%`;
    
        document.getElementById('display-year').innerText = song.year;
        
        const tierObj = TIER_DEFINITIONS.find(t => t.code === song.tier) || { name: song.tier };
        document.getElementById('display-tier').innerText = `${song.tier} (${tierObj.name})`;
        document.getElementById('select-tier').value = song.tier;
        document.getElementById('input-direct-rank').placeholder = `${song.order + 1}位`;
      }
    }
    
    // --------------------------------------------------
    // 🎧 視聴カウント＆タイマー計測ロジック
    // --------------------------------------------------
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) startListeningTimer();
      else stopListeningTimer();
      if (event.data === YT.PlayerState.ENDED) {
        isManualSelection = false;
        nextSong();
      }
    }
    
    function startListeningTimer() {
      stopListeningTimer();
      listenTimer = setInterval(() => {
        if (!player || !player.getDuration) return;
        const duration = player.getDuration();
        if (duration <= 0) return;
    
        const song = currentPlaylist[currentIndex];
        if (!song) return;
    
        if (!song.duration || song.duration !== Math.round(duration)) {
          song.duration = Math.round(duration);
          db.ref(`music_chart/songs/${song.id}/duration`).set(song.duration);
        }
    
        listenedSeconds++;
        song.totalWatchTime++;
        db.ref(`music_chart/songs/${song.id}/totalWatchTime`).set(song.totalWatchTime);
    
        const threshold = isManualSelection ? 0.1 : 0.3;
    
        if (!isCountedCurrentSong && (listenedSeconds / duration) >= threshold) {
          song.playCount++;
          isCountedCurrentSong = true;
          db.ref(`music_chart/songs/${song.id}/playCount`).set(song.playCount);
        }
      }, 1000);
    }
    
    function stopListeningTimer() { if (listenTimer) clearInterval(listenTimer); listenTimer = null; }
    function resetListenTimer() { stopListeningTimer(); listenedSeconds = 0; isCountedCurrentSong = false; }
    
    // --------------------------------------------------
    // 🖼️ ランキングUI描画
    // --------------------------------------------------
    function renderRankingUI() {
      if (currentMode === 'analytics') return;
    
      const listEl = document.getElementById('rank-list');
      listEl.innerHTML = '';
      const currentSong = currentPlaylist[currentIndex];
    
      let lastTier = null;
      const targetList = (currentMode === 'playCount' || currentMode === 'trending') ? currentPlaylist : songs;
    
      targetList.forEach((song, index) => {
        if (currentMode !== 'playCount' && currentMode !== 'trending' && song.tier !== lastTier) {
          const tierObj = TIER_DEFINITIONS.find(t => t.code === song.tier);
          const header = document.createElement('li');
          header.className = 'tier-header';
          header.innerText = `--- 🏆 Tier ${song.tier} : ${tierObj ? tierObj.name : ''} ---`;
          listEl.appendChild(header);
          lastTier = song.tier;
        }
    
        const li = document.createElement('li');
        li.className = 'rank-item';
        if (currentSong && song.id === currentSong.id) li.classList.add('active');
    
        li.onclick = () => {
          let idx = currentPlaylist.findIndex(s => s.id === song.id);
          if (idx !== -1) { 
            isManualSelection = true;
            currentIndex = idx; 
            loadCurrentSong(); 
          }
        };
    
        let metaStatsHtml = '';
    
        if (currentMode === 'playCount') {
          const retention = Math.round(getRetentionRate(song));
          metaStatsHtml = `<span style="font-size: 11px; color: #00ffcc; margin-right: 8px; white-space: nowrap;">👀 ${song.playCount}回 | 📊 ${retention}%</span>`;
        } else if (currentMode === 'trending') {
          const pastPlays = pastSnapshotData ? (pastSnapshotData[song.id]?.playCount || 0) : 0;
          const diff = song.playCount - pastPlays;
          metaStatsHtml = `<span style="font-size: 11px; color: #ffaa00; font-weight: bold; margin-right: 8px; white-space: nowrap;">🔥 +${diff}回</span>`;
        } else {
          let rankDiffHtml = '';
          const currentRank = index + 1;
    
          if (!pastSnapshotData || !pastSnapshotData[song.id] || pastSnapshotData[song.id].rank === undefined) {
            rankDiffHtml = `<span style="font-size: 10px; background: #ffaa00; color: #000; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-right: 6px;">NEW</span>`;
          } else {
            const pastRank = pastSnapshotData[song.id].rank;
            const diff = pastRank - currentRank;
    
            if (diff > 0) {
              rankDiffHtml = `<span style="font-size: 11px; color: #00ff88; font-weight: bold; margin-right: 6px;">↑${diff}</span>`;
            } else if (diff < 0) {
              rankDiffHtml = `<span style="font-size: 11px; color: #ff4444; font-weight: bold; margin-right: 6px;">↓${Math.abs(diff)}</span>`;
            } else {
              rankDiffHtml = `<span style="font-size: 11px; color: #888888; margin-right: 6px;">-</span>`;
            }
          }
          metaStatsHtml = rankDiffHtml;
        }
    
        li.innerHTML = `
          <span class="rank-num">${index + 1}位</span>
          <span class="rank-tier-tag">${song.tier}</span>
          <span class="rank-name">${song.title}</span>
          ${metaStatsHtml}
          <button class="rank-del-btn" onclick="deleteSong('${song.id}', event)">✕</button>
        `;
        listEl.appendChild(li);
      });
    }
    
    // --------------------------------------------------
    // バックアップ/復元 & その他操作
    // --------------------------------------------------
    function exportData() {
      if (songs.length === 0) return alert('保存するデータがありません。');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songs, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `music_chart_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
    
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
    
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedSongs = JSON.parse(e.target.result);
          if (Array.isArray(importedSongs)) {
            if (confirm(`現在のデータを上書きし、${importedSongs.length}曲のデータをFirebaseへ一括登録しますか？`)) {
              songs = importedSongs.map((s, idx) => ({
                ...s,
                tier: s.tier || scoreToTierCode(s.score || 80),
                order: idx
              }));
              saveAllToFirebase();
              alert('Firebaseへのデータ復元が完了しました！');
            }
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    }
    
    function addNewSong() {
      const titleInput = document.getElementById('input-title');
      let ytidInput = document.getElementById('input-ytid').value.trim();
      const yearInput = document.getElementById('input-year');
      const tierInput = document.getElementById('input-tier');
    
      if (!titleInput.value.trim() || !ytidInput) return alert('入力してください');
    
      if (ytidInput.includes('v=')) ytidInput = ytidInput.split('v=')[1].split('&')[0];
      else if (ytidInput.includes('youtu.be/')) ytidInput = ytidInput.split('youtu.be/')[1].split('?')[0];
    
      const newId = Date.now().toString();
      const newSong = {
        id: newId,
        youtubeId: ytidInput,
        title: titleInput.value.trim(),
        year: parseInt(yearInput.value) || 2024,
        tier: tierInput.value,
        playCount: 0,
        duration: 200,
        totalWatchTime: 0,
        order: songs.length
      };
    
      db.ref(`music_chart/songs/${newId}`).set(newSong);
    
      titleInput.value = '';
      document.getElementById('input-ytid').value = '';
    }
    
    function deleteSong(id, e) {
      e.stopPropagation();
      if (confirm('削除しますか？')) {
        db.ref(`music_chart/songs/${id}`).remove();
      }
    }
    
    function loadCurrentSong() {
      if (currentPlaylist.length === 0) return;
      const song = currentPlaylist[currentIndex];
    
      updateTrackInfoDisplay();
      resetListenTimer();
      renderRankingUI();
    
      if (player && player.loadVideoById) {
        player.loadVideoById(song.youtubeId);
      }
    }
    
    // YouTube API Ready
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
    
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: '',
        playerVars: { 'playsinline': 1 },
        events: {
          'onReady': () => { if (currentPlaylist.length > 0) loadCurrentSong(); },
          'onStateChange': onPlayerStateChange
        }
      });
    }
    
    function nextSong() {
      if (currentPlaylist.length === 0) return;
      isManualSelection = false;
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
      loadCurrentSong();
    }
    
    function prevSong() {
      if (currentPlaylist.length === 0) return;
      isManualSelection = false;
      currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
      loadCurrentSong();
    }
  </script>
</body>
